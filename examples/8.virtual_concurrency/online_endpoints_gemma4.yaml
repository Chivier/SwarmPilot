    base_url: "http://localhost:9220"
    api_key_env: "TOGETHER_API_KEY"
    model_id: "google/gemma-4-41b-it"
    concurrency_limit: 1

  - name: "fireworks-gemma4"
    base_url: "http://localhost:9221"
    api_key_env: "FIREWORKS_API_KEY"
    model_id: "google/gemma-4-41b-it"
    concurrency_limit: 2

  - name: "lepton-gemma4"
    base_url: "http://localhost:9222"
    api_key_env: "LEPTON_API_KEY"
    model_id: "google/gemma-4-41b-it"
    concurrency_limit: 3

[project]
name = "swarmpilot-toy-ranker"
version = "0.1.0"
description = "Example out-of-tree SwarmPilot engine plugin"
requires-python = ">=3.11"
dependencies = ["swarmpilot"]

# This table is the whole integration: SwarmPilot discovers the adapter
# through the swarmpilot.engines entry-point group.
[project.entry-points."swarmpilot.engines"]
toy-ranker = "toy_ranker.adapter:ToyRankerAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toy_ranker"]

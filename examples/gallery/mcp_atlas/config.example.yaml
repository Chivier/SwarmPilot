# MCP-Atlas replay benchmark configuration
#
# Usage:
#   1. Start cluster:  bash examples/gallery/replay/benchmark/start_cluster.sh
#   2. Prepare data:   python -m replay.cli prepare --dataset mcp-atlas --output data/mcp-atlas.jsonl
#   3. Run replay:     python -m replay.cli run --data data/mcp-atlas.jsonl --config mcp_atlas/config.example.yaml
#      (models are deployed/terminated automatically via Planner)

# ── Planner-based deployment (auto deploy/teardown) ───────────────
planner:
  url: http://localhost:8002
  large_model_id: Qwen/Qwen3-Next-80B-A3B-Instruct
  small_model_id: Qwen/Qwen3-VL-8B-Instruct
  gpu_per_instance_large: 4
  gpu_per_instance_small: 1
  replicas_large: 2
  replicas_small: 2

# ── Scheduler endpoints (where requests are sent) ─────────────────
large_model:
  base_url: http://localhost:8010/v1
  api_key: dummy
  model: Qwen/Qwen3-Next-80B-A3B-Instruct

small_model:
  base_url: http://localhost:8020/v1
  api_key: dummy
  model: Qwen/Qwen3-VL-8B-Instruct

# ── Replay parameters ─────────────────────────────────────────────
poisson_qps: 0.1
global_qps: 5.0
agent_delay_ms: 100
user_delay_ms: 5000
timeout_s: 120.0
max_tokens: 1

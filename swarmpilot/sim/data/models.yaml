# Model catalog for the cluster simulator.
#
# LLM entries carry what the step-time model needs: parameter count and the
# KV-cache shape (layers, KV heads, head dim), from each model's published
# config.json. Weights and KV cache are BF16.
#
# Diffusion and generic entries carry their own latency anchors instead.

llama-3.1-8b:
  kind: llm
  params_b: 8.03
  layers: 32
  kv_heads: 8
  head_dim: 128
  aliases: [meta-llama/Llama-3.1-8B, meta-llama/Llama-3.1-8B-Instruct,
            meta-llama/Meta-Llama-3.1-8B-Instruct]

llama-3.1-70b:
  kind: llm
  params_b: 70.6
  layers: 80
  kv_heads: 8
  head_dim: 128
  aliases: [meta-llama/Llama-3.1-70B, meta-llama/Llama-3.1-70B-Instruct,
            meta-llama/Meta-Llama-3.1-70B-Instruct]

llama-3.2-3b:
  kind: llm
  params_b: 3.21
  layers: 28
  kv_heads: 8
  head_dim: 128
  aliases: [meta-llama/Llama-3.2-3B, meta-llama/Llama-3.2-3B-Instruct]

qwen2.5-7b:
  kind: llm
  params_b: 7.62
  layers: 28
  kv_heads: 4
  head_dim: 128
  aliases: [Qwen/Qwen2.5-7B, Qwen/Qwen2.5-7B-Instruct]

sdxl:
  kind: diffusion
  # Diffusers SDXL base, 1024x1024, 30 steps, batch 1, on H100: about
  # 2.45 s. Baseten report TensorRT at 0.68 images/s (1.47 s) and about 40%
  # lower latency than the standard implementation, so 1.47 / 0.6.
  reference_gpu: H100-SXM-80GB
  ms_per_step_1024: 77.0
  vae_ms: 140.0
  max_batch: 4
  batch_alpha: 0.85
  source: Baseten SDXL TensorRT blog (H100, 1024x1024, 30 steps)
  aliases: [stabilityai/stable-diffusion-xl-base-1.0]

generic-small:
  kind: generic
  # Stand-in for a private inference library: no public numbers, a
  # synthetic heavy-ish latency distribution with a concurrency limit.
  reference_gpu: RTX4090-24GB
  mean_ms: 250.0
  cv: 0.6
  concurrency: 4
  source: synthetic
  aliases: []

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache virtual environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Verify installation
        run: uv pip list

      - name: Run scheduler tests
        run: uv run pytest tests/scheduler/ -v --tb=short

      - name: Run planner tests
        run: uv run pytest tests/planner/ -v --tb=short

      - name: Run predictor tests
        run: uv run pytest tests/predictor/ -v --tb=short

      - name: Run known-bug regression tests
        run: uv run pytest tests/regression/ -v --tb=short

      - name: Run engine adapter contract tests
        run: uv run pytest tests/engines/ -v --tb=short

      - name: Run black-box dispatch conformance tests
        run: uv run pytest tests/conformance/ -v --tb=short

      - name: Run API translation tests
        run: uv run pytest tests/api/ -v --tb=short

      - name: Run golden vector replay
        run: uv run pytest tests/golden/ -v --tb=short

      - name: Run simulator data tests
        run: uv run pytest tests/sim/ -v --tb=short

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests (calibration table printed)
        run: cargo test --release --locked -- --nocapture

      - name: Build simulator and gateway binaries
        run: cargo build --release --locked

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Run simulator Python tests against the binary
        working-directory: .
        run: |
          uv sync --dev
          uv run pytest tests/sim/ -v --tb=short

      - name: Run conformance, control and routing A/B tests on the gateway
        # Every conformance test runs against the Python proxy and against
        # swarmpilot-gateway (phase R3); the A/B needs identical decisions.
        # The API translation matrix too (R3b), with a byte-level A/B.
        working-directory: .
        env:
          SWARMPILOT_GATEWAY_BIN: rust/target/release/swarmpilot-gateway
        run: |
          uv run pytest tests/conformance/ -v --tb=short
          uv run pytest tests/api/test_conformance_matrix.py -v --tb=short

  rust-core:
    # SCHEDULER_CORE=rust: the Rust scheduling core must match the Python
    # one bit for bit (golden vectors, differential tests, routing-sim
    # A/B) and pass the Python suites and the emulated cluster run on it.
    runs-on: ubuntu-latest
    env:
      # Keep the venv uv sync built with the core extra; a plain uv run
      # would sync it back to the default extras.
      UV_NO_SYNC: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies with the Rust core
        run: uv sync --dev --extra core

      - name: Replay golden vectors in Rust
        working-directory: rust
        run: cargo test --release --locked -p swarmpilot-core

      - name: Run Python-vs-Rust parity tests
        env:
          SWARMPILOT_REQUIRE_RUST_CORE: "1"
        run: uv run pytest tests/core/ tests/golden/ -v --tb=short

      - name: Run scheduler tests on the Rust core
        env:
          SCHEDULER_CORE: rust
        run: uv run pytest tests/scheduler/ --tb=short -q

      - name: Run predictor tests on the Rust core
        env:
          SCHEDULER_CORE: rust
        run: uv run pytest tests/predictor/ --tb=short -q

      - name: Run engine, API and regression tests on the Rust core
        env:
          SCHEDULER_CORE: rust
        run: |
          uv run pytest tests/engines/ --tb=short -q
          uv run pytest tests/api/ tests/conformance/ tests/regression/ tests/golden/ --tb=short -q

      - name: Build simulator binary
        working-directory: rust
        run: cargo build --release --locked -p swarmpilot-sim

      - name: Run the emulated cluster on the Rust core
        env:
          SCHEDULER_CORE: rust
        run: uv run pytest tests/sim/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache virtual environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Verify installation
        run: uv pip list

      - name: Run Ruff
        run: uv run ruff check swarmpilot/ tests/

      - name: Check formatting
        run: uv run ruff format --check swarmpilot/ tests/

      - name: Run tests with coverage
        run: uv run pytest tests/ --cov=swarmpilot --cov-report=term-missing --cov-fail-under=30

  audit:
    # Report-only until plan item 8.5 makes fixable high/critical fail CI.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Export locked requirements
        run: uv export --frozen --no-hashes --no-emit-project -o requirements.txt

      - name: Run pip-audit
        run: >-
          uvx pip-audit --no-deps --disable-pip -r requirements.txt
          -f json -o pip-audit.json || true

      - name: Summarize advisories
        run: |
          python3 - <<'PY'
          import json
          data = json.load(open("pip-audit.json"))
          vulns = [
              (d["name"], d["version"], v["id"], ",".join(v.get("fix_versions", [])))
              for d in data.get("dependencies", [])
              for v in d.get("vulns", [])
          ]
          print(f"{len(vulns)} advisories in {len({v[0] for v in vulns})} packages")
          for name, ver, vid, fix in sorted(vulns):
              print(f"{name}=={ver}  {vid}  fix: {fix or 'none'}")
          PY

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit
          path: pip-audit.json

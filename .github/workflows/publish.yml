name: Publish

# Builds the placeholder `swarmpilot` distribution and publishes it to PyPI
# using Trusted Publishing (OIDC) — no API token or stored secret required.
#
# Before the first run, register a pending publisher on PyPI
# (https://pypi.org/manage/account/publishing/) with these values:
#   PyPI Project Name: swarmpilot
#   Owner:             Chivier
#   Repository name:   SwarmPilot
#   Workflow name:     publish.yml
#   Environment name:  (leave blank)
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        working-directory: placeholder
        run: python -m build --outdir dist

      - name: Check distribution metadata
        working-directory: placeholder
        run: twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: placeholder/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # REQUIRED for Trusted Publishing (OIDC)
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

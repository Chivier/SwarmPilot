[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarmpilot"
version = "0.0.1"
description = "Placeholder for the SwarmPilot distributed task scheduling system."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Chivier" }]
keywords = ["swarmpilot", "scheduling", "placeholder"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Chivier/SwarmPilot"

[project.scripts]
swarmpilot = "swarmpilot:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmpilot"]

[package]
name = "swarmpilot-sim"
description = "Command-line front end of the SwarmPilot cluster simulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "swarmpilot-sim"
path = "src/main.rs"

[dependencies]
swarmpilot-sim-core = { path = "../sim-core" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
swarmpilot-sim-cluster = { path = "../sim-cluster" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal"] }

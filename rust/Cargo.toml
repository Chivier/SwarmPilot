[workspace]
resolver = "2"
members = ["crates/sim-core", "crates/sim-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
repository = "https://github.com/Chivier/SwarmPilot"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
